---
setup:

  - do:
      ingest.put_pipeline:
        id: "geo_extension"
        body:  >
          {
            "description": "Add extra geo fields to geo_shape fields.",
            "processors": [
              {
                "geo_extension": {
                  "field": "geo_shape_*"
                }
              }
            ]
          }

# Single shard so bucket ordering and shard_size behaviour stay deterministic
  - do:
      indices.create:
        index: test_index
        body:
          settings:
            number_of_shards: 1

  - do:
      indices.put_mapping:
        index: test_index
        body:
          dynamic_templates: [
            {
              "geo_shapes": {
                "match": "geo_shape_*",
                "mapping": {
                  "properties": {
                    "shape": {"enabled": false},
                    "fixed_shape": {"type": "geo_shape"},
                    "hash": {"type": "keyword"},
                    "wkb": {"type": "binary", "doc_values": true},
                    "type": {"type": "keyword"},
                    "area": {"type": "half_float"},
                    "bbox": {"type": "geo_point"},
                    "centroid": {"type": "geo_point"}
                  }
                }
              }
            }
          ]

# id 1: exactly covers tile z5/16/15, whose corners are mercantile.bounds(16, 15, 5)
  - do:
      index:
        index: test_index
        pipeline: "geo_extension"
        body:
          id: 1
          geo_shape_0:
            type: "Polygon"
            coordinates: [[[0, 0], [11.25, 0], [11.25, 11.178401873711781], [0, 11.178401873711781], [0, 0]]]

# id 2: straddles the eastern edge of the window
  - do:
      index:
        index: test_index
        pipeline: "geo_extension"
        body: { "id": 2, "geo_shape_0": { "type": "Polygon", "coordinates": [[[5,0],[30,0],[30,5],[5,5],[5,0]]] } }

# id 3: nowhere near the window
  - do:
      index:
        index: test_index
        pipeline: "geo_extension"
        body: { "id": 3, "geo_shape_0": { "type": "Polygon", "coordinates": [[[50,50],[51,50],[51,51],[50,51],[50,50]]] } }

# id 4: inside the window, but 0.0001 degrees across, well under one grid unit (11.25/4096 = 0.00275),
# so it collapses to a single point once quantized
  - do:
      index:
        index: test_index
        pipeline: "geo_extension"
        body: { "id": 4, "geo_shape_0": { "type": "Polygon", "coordinates": [[[5,5],[5.0001,5],[5.0001,5.0001],[5,5.0001],[5,5]]] } }

# ids 5 and 6: distinct shapes 0.0001 degrees apart, which is under one grid unit, so both quantize
# onto the very same ring. They must stay two features.
  - do:
      index:
        index: test_index
        pipeline: "geo_extension"
        body: { "id": 5, "geo_shape_0": { "type": "Polygon", "coordinates": [[[1,1],[2,1],[2,2],[1,2],[1,1]]] } }

  - do:
      index:
        index: test_index
        pipeline: "geo_extension"
        body: { "id": 6, "geo_shape_0": { "type": "Polygon", "coordinates": [[[1.0001,1.0001],[2.0001,1.0001],[2.0001,2.0001],[1.0001,2.0001],[1.0001,1.0001]]] } }

  - do:
      indices.refresh: {}

---
"Shape covering the window maps onto the whole grid":

  - do:
      search:
        body:
          query:
            term:
              id: 1
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0

# The window corners map to the grid corners, y growing downwards (origin top-left). The exterior
# ring has a positive signed area over these coordinates (4096*4096 = 16777216), which is what the
# MVT spec requires of exteriors, and reads as clockwise on screen in a y-down grid.
  - match: { aggregations.g.buckets.0.key: "POLYGON ((4096 4096, 0 4096, 0 0, 4096 0, 4096 4096))" }
  - match: { aggregations.g.buckets.0.doc_count: 1 }
  - match: { aggregations.g.sum_other_doc_count: 0 }

---
"Shape straddling the window is clipped to it":

  - do:
      search:
        body:
          query:
            term:
              id: 2
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0

# Clipped at x=4096 (lon 11.25) instead of running out to lon 30.
  - match: { aggregations.g.buckets.0.key: "POLYGON ((1820 2273, 4096 2273, 4096 4096, 1820 4096, 1820 2273))" }
  - match: { aggregations.g.sum_other_doc_count: 0 }

---
"Shape outside the window is dropped from the response":

  - do:
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                size: 10
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0

# ids 1, 2, 5 and 6 survive. id 3 falls outside the window and id 4 collapses on the grid; both are
# gone entirely rather than returned empty, and their documents are accounted for as hidden.
  - length: { aggregations.g.buckets: 4 }
  - match: { aggregations.g.sum_other_doc_count: 2 }

---
"Distinct shapes quantizing onto the same ring stay distinct features":

  - do:
      search:
        body:
          query:
            terms:
              id: [5, 6]
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                size: 10
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0

# Both shapes round onto the same grid ring, so their returned geometry is identical. They must not
# be merged: the coordinator keys buckets on the hash of the shape as stored, not on what it was
# rescaled to. Merging them would sum their doc counts and make one of the two vanish.
  - length: { aggregations.g.buckets: 2 }
  - match: { aggregations.g.buckets.0.key: "POLYGON ((728 3732, 364 3732, 364 3368, 728 3368, 728 3732))" }
  - match: { aggregations.g.buckets.1.key: "POLYGON ((728 3732, 364 3732, 364 3368, 728 3368, 728 3732))" }
  - match: { aggregations.g.buckets.0.doc_count: 1 }
  - match: { aggregations.g.buckets.1.doc_count: 1 }
  - match: { aggregations.g.sum_other_doc_count: 0 }

---
"Shape that collapses on the grid is dropped from the response":

  - do:
      search:
        body:
          query:
            term:
              id: 4
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0

# Sub-pixel: every vertex rounds onto the same grid point, so nothing is left to draw.
  - length: { aggregations.g.buckets: 0 }
  - match: { aggregations.g.sum_other_doc_count: 1 }

---
"Without an extent, shapes are quantized onto a 4096 grid":

  - do:
      search:
        body:
          query:
            term:
              id: 4
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                tile:
                  z: 5
                  x: 16
                  y: 15
                  buffer: 0

# The same sub-pixel shape as above collapses on the default grid as it does on an explicit 4096 one.
  - length: { aggregations.g.buckets: 0 }
  - match: { aggregations.g.sum_other_doc_count: 1 }

---
"Buffer widens the clip window past the extent":

  - do:
      search:
        body:
          query:
            term:
              id: 2
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0.0625

# With a 6.25% buffer the shape is kept out to lon 11.953125, i.e. x = 4352 > extent.
  - match: { aggregations.g.buckets.0.key: "POLYGON ((1820 4096, 1820 2273, 4352 2273, 4352 4096, 1820 4096))" }

---
"Simplification runs on the clipped shape":

  - do:
      search:
        body:
          query:
            term:
              id: 2
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                simplify:
                  zoom: 6
                  algorithm: DOUGLAS_PEUCKER
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 4096
                  buffer: 0

  - match: { aggregations.g.buckets.0.key: "POLYGON ((1820 2273, 4096 2273, 4096 4096, 1820 4096, 1820 2273))" }

---
"Omitting tile leaves the previous behaviour untouched":

  - do:
      search:
        body:
          query:
            term:
              id: 1
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt

  - match:
      aggregations.g.buckets.0.key: "POLYGON ((11.25 0, 11.25 11.178401873711781, 0 11.178401873711781, 0 0,
        11.25 0))"

---
"A bbox is rejected, alone or next to z/x/y":

# bbox was the window before z/x/y. It is not declared any more, so it fails like any unknown field instead of
# being ignored next to a tile, which a half-migrated client would otherwise never notice.
  - do:
      catch: /unknown field \[bbox\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  x: 16
                  y: 15
                  bbox: [0, 0, 11.25, 11.178401873711781]
                  extent: 4096

  - do:
      catch: /unknown field \[bbox\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  bbox: [0, 0, 11.25, 11.178401873711781]
                  extent: 4096

---
"A missing z, x or y is rejected":

  - do:
      catch: /Required one of fields \[z\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  x: 16
                  y: 15
                  extent: 4096

  - do:
      catch: /Required one of fields \[x\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  y: 15
                  extent: 4096

  - do:
      catch: /Required one of fields \[y\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  x: 16
                  extent: 4096

---
"A tile index outside its zoom is rejected":

  - do:
      catch: /\[x\] must be within \[0, 31\] at \[z\] \[5\], got \[32\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  x: 32
                  y: 15
                  extent: 4096

  - do:
      catch: /\[y\] must be within \[0, 31\] at \[z\] \[5\], got \[-1\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  x: 16
                  y: -1
                  extent: 4096

  - do:
      catch: /\[z\] must be within \[0, 29\], got \[30\]/
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 30
                  x: 0
                  y: 0
                  extent: 4096
---
"A negative extent is rejected":

  - do:
      catch: bad_request
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: -1

---
"A zero extent is rejected":

  - do:
      catch: bad_request
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                tile:
                  z: 5
                  x: 16
                  y: 15
                  extent: 0

---
"A shape whose bbox misses the window does not take a size slot":

# Shapes whose bounding box misses the window are kept out of the top-N ranking, so a size slot is
# not spent on them. Without that, this first request returned zero buckets: the single slot went to
# id 2, which has the largest perimeter in the fixture set and does not reach this window.
  - do:
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                size: 1
                tile:
                  z: 8
                  x: 128
                  y: 127
                  extent: 4096
                  buffer: 0

  - length: { aggregations.g.buckets: 1 }
  - set: { aggregations.g.buckets.0.key: unfiltered_key }

# Same window, same size, now with the spatial filter the Explore API sends. The filter is a large
# performance win, since elasticsearch then skips the out-of-window documents through the index
# instead of handing them to the aggregation, but it must not change the answer.
  - do:
      search:
        body:
          query:
            geo_shape:
              geo_shape_0.fixed_shape:
                shape:
                  type: "envelope"
                  coordinates: [[0, 1.4061088354351565], [1.40625, 0]]
                relation: "intersects"
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                size: 1
                tile:
                  z: 8
                  x: 128
                  y: 127
                  extent: 4096
                  buffer: 0

  - length: { aggregations.g.buckets: 1 }
  - match: { aggregations.g.buckets.0.key: $unfiltered_key }

---
"Points outside the window do not take a size slot":

# A point is recognized from its WKB header without being parsed, which used to skip the window check
# too. Every point ties on perimeter 0, so the single slot went to an arbitrary point, most likely one
# of the nine outside the window, which the clip then emptied, leaving no bucket at all.
  - do:
      bulk:
        refresh: true
        index: test_index
        pipeline: "geo_extension"
        body:
          - { "index": {} }
          - { "id": 10, "geo_shape_0": { "type": "Point", "coordinates": [100.5, 40.5] } }
          - { "index": {} }
          - { "id": 11, "geo_shape_0": { "type": "Point", "coordinates": [110, 40] } }
          - { "index": {} }
          - { "id": 12, "geo_shape_0": { "type": "Point", "coordinates": [120, 40] } }
          - { "index": {} }
          - { "id": 13, "geo_shape_0": { "type": "Point", "coordinates": [130, 40] } }
          - { "index": {} }
          - { "id": 14, "geo_shape_0": { "type": "Point", "coordinates": [100.5, 50] } }
          - { "index": {} }
          - { "id": 15, "geo_shape_0": { "type": "Point", "coordinates": [100.5, 30] } }
          - { "index": {} }
          - { "id": 16, "geo_shape_0": { "type": "Point", "coordinates": [90, 40.5] } }
          - { "index": {} }
          - { "id": 17, "geo_shape_0": { "type": "Point", "coordinates": [80, 40.5] } }
          - { "index": {} }
          - { "id": 18, "geo_shape_0": { "type": "Point", "coordinates": [70, 40.5] } }
          - { "index": {} }
          - { "id": 19, "geo_shape_0": { "type": "Point", "coordinates": [60, 40.5] } }

  - do:
      search:
        body:
          size: 0
          aggs:
            g:
              geoshape:
                field: "geo_shape_0.wkb"
                output_format: wkt
                size: 1
                tile:
                  z: 8
                  x: 199
                  y: 96
                  extent: 4096

  - length: { aggregations.g.buckets: 1 }
  - match: { aggregations.g.buckets.0.type: "Point" }
